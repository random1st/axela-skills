# Generated by skillctl marketplace prepare-notary. Re-run this command to refresh it.
name: Notarize marketplace

on:
  push:
    branches:
      - "e2e-509419d4-native-release"
    paths:
      - "catalog.dsse.json"
      - .github/workflows/notarize.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  notarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: "random1st/skilltrust@v0.4.2"
        with:
          command: notarize
          repository: .
          notary-url: "https://axela.app/v1/catalogs/e2e-509419d4-native/e2e-509419d4-skills"
